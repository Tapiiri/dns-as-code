name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3

      - name: Formatting
        run: nix fmt -- --check .

      - name: Lint workflows
        run: nix shell --inputs-from . nixpkgs#actionlint nixpkgs#shellcheck -c actionlint

      - name: Build octoDNS
        run: nix build .#octodns
