# Reusable: dry-run octoDNS for the calling domain repo.
#
# Runs in the CALLER's checkout and builds `.#octodns` from the caller's flake,
# which re-exports this repo's package. The caller's flake.lock therefore pins
# the octoDNS version, and `nix flake update dns-as-code` is the upgrade.
#
# Never passes --doit, so it cannot change DNS. Give it the READ-ONLY token.
#
# The plan goes to the job summary, and on a pull_request event also to one
# PR comment that is updated in place on every push. The caller must grant
# `pull-requests: write` for the comment.

name: plan

on:
  workflow_call:
    inputs:
      config-file:
        description: octoDNS config, relative to the caller's repo root
        type: string
        default: config/production.yaml
    secrets:
      hetzner-token-ro:
        description: Hetzner Cloud API token, read-only
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3

      - name: Build octoDNS
        run: nix build .#octodns --out-link octodns

      # What the commit hooks check locally. Hooks never run on a push from a
      # cloud session, so CI repeats them. The provider makes no request at
      # construction, so a dummy token is safe, but it must be non-empty.
      - name: Validate
        env:
          HETZNER_TOKEN: dummy-token-for-validate-only
          CONFIG_FILE: ${{ inputs.config-file }}
        run: |
          octodns/bin/octodns-validate --config-file "$CONFIG_FILE"
          if grep -rn -e '__DOMAIN__' -e '__MIGADU_VERIFY_TOKEN__' zones/; then
            echo "::error::unreplaced template placeholder in zones/"
            exit 1
          fi

      # The plan comes out through octoDNS's logger on stderr, not stdout.
      # --quiet keeps only warnings, errors and the plan, so plan.txt is the
      # plan plus anything worth a warning. Dropped from the comment, but kept
      # in the log: the logger's header line, and the SOA warning the Hetzner
      # provider prints on every run (SOA is outside octoDNS's control).
      - name: Plan
        env:
          HETZNER_TOKEN: ${{ secrets.hetzner-token-ro }}
          CONFIG_FILE: ${{ inputs.config-file }}
        run: |
          set -o pipefail
          if [ -z "$HETZNER_TOKEN" ]; then
            echo "::error::the read-only Hetzner token secret is empty or not set"
            exit 1
          fi
          octodns/bin/octodns-sync --quiet --config-file "$CONFIG_FILE" 2>&1 \
            | tee /dev/stderr \
            | sed -E -e '/^[0-9T:-]+ +\[[0-9]+\] +INFO +Plan *$/d' \
                -e '/WARNING .*populate: skipping unsupported SOA record$/d' > plan.txt

      - name: Report
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          marker='<!-- dns-as-code:plan -->'
          {
            echo "$marker"
            echo "### DNS plan for \`${HEAD_SHA:0:7}\`"
            echo
            echo "Read-only dry run against the live zone. Merging to main applies exactly this, unless the zone or main changes first."
            echo
            echo '```'
            head -c 60000 plan.txt
            echo '```'
          } > comment.md
          cat comment.md >> "$GITHUB_STEP_SUMMARY"

          [ -n "$PR_NUMBER" ] || exit 0

          # One comment per PR, found by its marker and edited in place.
          existing="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq "[.[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\")))][0].id // empty" \
            | head -n1)"
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -F body=@comment.md > /dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -F body=@comment.md > /dev/null
          fi
