# Reusable: apply the calling domain repo's main to its zone.
#
# Works only for domain repos owned by the same account as dns-as-code: the
# read-write token is an environment secret, and environment secrets do not
# reach a reusable workflow across owners. Repos owned by anyone else use
# actions/apply from their own job instead; it carries the same steps.
#
# The git remote is the source of truth and DNS follows it. This runs only for
# a push to main, so only a commit that won the push is ever applied, and it
# refuses unless that commit is still the tip of main: an older run must never
# overwrite a newer one, because octoDNS owns the zone completely.
#
# The READ-WRITE token is an environment secret in the caller's `production`
# environment, which must be restricted to deploy from main only. The caller
# passes `secrets: inherit`; a job that names an environment reads that
# environment's secrets, so the token never exists as a repository secret.

name: apply

on:
  workflow_call:
    inputs:
      config-file:
        description: octoDNS config, relative to the caller's repo root
        type: string
        default: config/production.yaml
    secrets:
      HETZNER_TOKEN:
        description: Hetzner Cloud API token, read and write (environment secret in `production`)
        required: false

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: production
    # One apply at a time per domain repo, never cancelled mid-sync. A newer
    # push queues behind the running one and applies after it.
    concurrency:
      group: dns-apply-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Refuse anything but main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::apply runs only for refs/heads/main, not $GITHUB_REF"
          exit 1

      - uses: actions/checkout@v5

      # The guard `just sync` had: apply only the commit that is main right
      # now. If main has moved, a newer run is queued and will apply it.
      - name: Check this commit is still the tip of main
        id: tip
        run: |
          git fetch --depth=1 origin main
          tip="$(git rev-parse FETCH_HEAD)"
          if [ "$tip" != "$GITHUB_SHA" ]; then
            echo "::notice::main is now $tip, not $GITHUB_SHA; leaving it to the newer run"
            echo "current=false" >> "$GITHUB_OUTPUT"
          else
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: cachix/install-nix-action@v31
        if: steps.tip.outputs.current == 'true'

      - name: Build octoDNS
        if: steps.tip.outputs.current == 'true'
        run: nix build .#octodns --out-link octodns

      - name: Validate
        if: steps.tip.outputs.current == 'true'
        env:
          HETZNER_TOKEN: dummy-token-for-validate-only
          CONFIG_FILE: ${{ inputs.config-file }}
        run: |
          octodns/bin/octodns-validate --config-file "$CONFIG_FILE"
          if grep -rn -e '__DOMAIN__' -e '__MIGADU_VERIFY_TOKEN__' zones/; then
            echo "::error::unreplaced template placeholder in zones/"
            exit 1
          fi

      # --doit prints the plan before applying it, so the log records exactly
      # what changed.
      - name: Apply
        if: steps.tip.outputs.current == 'true'
        env:
          HETZNER_TOKEN: ${{ secrets.HETZNER_TOKEN }}
          CONFIG_FILE: ${{ inputs.config-file }}
        run: |
          if [ -z "$HETZNER_TOKEN" ]; then
            echo "::error::HETZNER_TOKEN is empty: add it as an environment secret in 'production'"
            exit 1
          fi
          octodns/bin/octodns-sync --config-file "$CONFIG_FILE" --doit
